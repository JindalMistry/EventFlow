name: AWS OIDC Test

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::668774618445:role/EventFlowGitHubActionsRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        run: |
          set -e
          echo "Getting ECR authorization token..."
          aws ecr get-login-password --region ap-south-1 | \
            docker login \
              --username AWS \
              --password-stdin 668774618445.dkr.ecr.ap-south-1.amazonaws.com