name: EventFlow AWS CI/CD Pipeline

on:
  push:
    branches:
      - 'release/*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::668774618445:role/EventFlowGitHubActionsRole
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Login to ECR
        run: |
          set -e
          echo "Getting ECR authorization token..."
          aws ecr get-login-password --region ap-south-1 | \
            docker login \
              --username AWS \
              --password-stdin 668774618445.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build API Image
        run: |
          docker build \
            -f ./EventFlow.API/Dockerfile \
            -t 668774618445.dkr.ecr.ap-south-1.amazonaws.com/eventflow-api:${{ github.sha }} \
            .
          
      - name: Push API Image to ECR
        run: |
          docker push 668774618445.dkr.ecr.ap-south-1.amazonaws.com/eventflow-api:${{ github.sha }}
        
      - name: Build Worker Image
        run: |
          docker build \
            -f ./EventFlow.Worker/Dockerfile \
            -t 668774618445.dkr.ecr.ap-south-1.amazonaws.com/eventflow-worker:${{ github.sha }} \
            .

      - name: Push Worker Image to ECR
        run: |
          docker push 668774618445.dkr.ecr.ap-south-1.amazonaws.com/eventflow-worker:${{ github.sha }}

      - name: Render API task definition
        id: render-api
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs/api-task-definition.json
          container-name: eventflow-api
          image: 668774618445.dkr.ecr.ap-south-1.amazonaws.com/eventflow-api:${{ github.sha }}
      
      - name: Deploy API
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-api.outputs.task-definition }}
          service: API
          cluster: EventFlow
          wait-for-service-stability: true
          wait-max-delay-seconds: 15

      - name: Render Worker task definition
        id: render-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs/worker-task-definition.json
          container-name: Worker
          image: 668774618445.dkr.ecr.ap-south-1.amazonaws.com/eventflow-worker:${{ github.sha }}

      - name: Deploy Worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-worker.outputs.task-definition }}
          service: Worker
          cluster: EventFlow
          wait-for-service-stability: true
          wait-max-delay-seconds: 15